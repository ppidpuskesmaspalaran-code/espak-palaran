services:
  - type: web
    name: espak-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: espak
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
